<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f4e8">
  <title>Mylotopi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/main.css">
</head>
<body>
  <div class="qr-page">
    <div class="qr-atmosphere" aria-hidden="true"></div>

    <header class="qr-header" id="qr-topbar">
      <nav class="qr-shell qr-header__inner" id="qr-nav">
        <div class="qr-brand" aria-label="Mylotopi Windmiller's Life">
          <span class="qr-brand__name">Mylotopi</span>
          <span class="qr-brand__tagline">Windmiller's Life</span>
        </div>

        <details class="qr-menu qr-menu--language" id="language-menu">
          <summary class="qr-menu__trigger qr-menu__trigger--language" id="language-menu-trigger">
            <span class="qr-menu__label" id="language-control-label"></span>
            <span class="qr-menu__value" id="active-language-label"></span>
            <span class="qr-menu__icon" aria-hidden="true"></span>
          </summary>
          <div class="qr-menu__popover qr-menu__popover--language" id="language-switcher" role="group"></div>
        </details>

        <details class="qr-menu qr-menu--stop" id="spot-menu">
          <summary class="qr-menu__trigger qr-menu__trigger--stop" id="spot-menu-trigger">
            <span class="qr-menu__label" id="spot-control-label"></span>
            <span class="qr-menu__value" id="active-spot-label"></span>
            <span class="qr-menu__icon" aria-hidden="true"></span>
          </summary>
          <div class="qr-menu__popover qr-menu__popover--stop" id="spot-switcher" role="group"></div>
        </details>
      </nav>
    </header>

    <header class="qr-shell qr-hero" aria-labelledby="qr-title">
      <p class="qr-hero__eyebrow" id="qr-kicker"></p>
      <h1 class="qr-hero__title" id="qr-title"></h1>
      <p class="qr-hero__current" id="current-stop-label"></p>
      <p class="qr-hero__intro" id="qr-intro"></p>
      <div class="qr-hero__rule" aria-hidden="true">
        <span></span>
        <i></i>
        <span></span>
      </div>
    </header>

    <main class="qr-shell qr-main" id="qr-main"></main>
  </div>

  <p class="sr-only" id="qr-announcer" aria-live="polite"></p>

  <script src="./assets/js/content-meta.js" defer></script>
  <script src="./assets/js/i18n.js" defer></script>
  <script src="./assets/js/app.js" defer></script>
</body>
</html>
